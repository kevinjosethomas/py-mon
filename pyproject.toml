[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mon"
dynamic = ["version"]
description = "🔁 Automatically restart application when file changes are detected; made for development"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kevinjosethomas", email = "kevin.jt2007@gmail.com" }]
keywords = ["development", "testing", "monitor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "colorama",
    "watchdog",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
pymon = "pymon.main:main"

[project.urls]
Homepage = "https://github.com/kevinjosethomas/py-mon"
Changelog = "https://github.com/kevinjosethomas/py-mon/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["pymon"]

[tool.setuptools.dynamic]
version = { attr = "pymon.__version__" }
